name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  smoke:
    name: Public smoke (acms.areteailab.com)
    runs-on: ubuntu-latest
    steps:
      - name: Health + login redirect
        run: |
          echo "dns:"; getent hosts acms.areteailab.com || true
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/h.json -w "%{http_code}" -m 20 https://acms.areteailab.com/api/v1/health) && break
            echo "attempt $i failed"; sleep 5
          done
          echo "health=$code $(cat /tmp/h.json)"
          [ "$code" = "200" ]
          loc=$(curl -s -o /dev/null -w "%{redirect_url}" -m 20 https://acms.areteailab.com/api/v1/auth/login)
          echo "login_redirect=$loc"
          case "$loc" in https://open.feishu.cn/open-apis/authen/v1/index*) ;; *) exit 1;; esac
